<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mailwhistle Moodle plugin icon</title>
  <desc id="desc">Envelope with whistle, mortarboard and sending signal.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b75d1"/>
      <stop offset="1" stop-color="#064b9b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff9b21"/>
      <stop offset="1" stop-color="#f15a24"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.45" stop-color="#cbd5df"/>
      <stop offset="1" stop-color="#7a8795"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#102a44" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#f7fafc"/>

  <g filter="url(#shadow)">
    <!-- Envelope -->
    <rect x="86" y="166" width="310" height="220" rx="30" fill="url(#blue)" stroke="#062f67" stroke-width="14"/>
    <path d="M99 185 241 293 382 185" fill="#ffffff" stroke="#062f67" stroke-width="12" stroke-linejoin="round"/>
    <path d="M99 374 213 274" fill="none" stroke="#e8f3ff" stroke-width="16" stroke-linecap="round"/>
    <path d="M383 374 269 274" fill="none" stroke="#e8f3ff" stroke-width="16" stroke-linecap="round"/>

    <!-- Graduation cap -->
    <path d="M76 144 243 76 427 132 260 206z" fill="url(#orange)" stroke="#a73714" stroke-width="10" stroke-linejoin="round"/>
    <path d="M158 183c46 30 112 33 174 5v45c-55 32-120 29-174-2z" fill="#f36b21" stroke="#a73714" stroke-width="9"/>
    <path d="M246 111c-55 31-95 69-126 117" fill="none" stroke="#172033" stroke-width="18" stroke-linecap="round"/>
    <circle cx="123" cy="228" r="18" fill="#172033"/>
    <path d="M113 242c-18 30-15 58-3 88m16-82c-2 35 3 61 22 87" stroke="#f36b21" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Whistle -->
    <g transform="translate(210 258) rotate(-10)">
      <path d="M0 48h148a62 62 0 1 1 14 78H48L0 91z" fill="url(#steel)" stroke="#172033" stroke-width="13" stroke-linejoin="round"/>
      <circle cx="174" cy="79" r="42" fill="#dfe7ef" stroke="#ffffff" stroke-width="10"/>
      <path d="M24 56h80l-18 31H24z" fill="#ffffff" opacity="0.78"/>
      <rect x="9" y="74" width="54" height="30" rx="8" fill="#172033"/>
      <rect x="110" y="50" width="21" height="53" rx="4" fill="#172033"/>
    </g>

    <!-- Paper plane -->
    <path d="M363 102 449 68 419 178 389 132 338 117z" fill="#ffffff" stroke="#064b9b" stroke-width="12" stroke-linejoin="round"/>
    <path d="M389 132 449 68" stroke="#0b75d1" stroke-width="10" stroke-linecap="round"/>
    <path d="M418 230c25 8 47 30 54 58m-36-75c28 5 52 25 65 54" fill="none" stroke="#0b75d1" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
