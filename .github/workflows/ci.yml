# Catalyst reusable Moodle plugin CI.
# Wraps moodle-plugin-ci and derives the Moodle test matrix from
# $plugin->supported / $plugin->requires in version.php.
# See: https://github.com/catalyst/catalyst-moodle-workflows
name: ci

on: [push, pull_request]

jobs:
  ci:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Moodle 5.0 is the minimum supported branch, which requires PHP 8.2+.
      min_php: '8.2'
      # Fail the build on any phpcs (codechecker) warning, not just errors.
      codechecker_max_warnings: 0
      # Limit the test matrix to Moodle 5.2 for faster runs. The plugin still
      # declares support for 5.0-5.2 in version.php ($plugin->supported); this
      # only narrows which branches CI exercises.
      moodle_branches: '502'
